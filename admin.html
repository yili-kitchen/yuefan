<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>約飯吧・訂單後台</title>
<style>
:root{--bg:#fff;--fg:#2b2b28;--mut:#8a877f;--line:#ebe8e1;--soft:#fbf5ee;--ac:#e07b2a;--acf:#fff;--warn:#c0554a;--ok:#5f7a52}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--fg:#eeece6;--mut:#a09d94;--line:#333330;--soft:#262624;--ac:#f0a060;--acf:#1c1c1a;--warn:#e0857a;--ok:#f0a060}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px}
button.on,button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button.pri{border-radius:12px;padding:11px;width:100%}
input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.hide{display:none!important}
header{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
header img{border-radius:50%}
header h1{font:500 20px "Noto Serif TC",Georgia,serif;margin:0}
header small{color:var(--mut);display:block;font-size:12px}
.login{max-width:340px;margin:12vh auto 0;text-align:center}
.login img{border-radius:50%;margin-bottom:8px}
.login h1{font:500 22px "Noto Serif TC",Georgia,serif;margin:0 0 18px}
.login label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin:12px 0 16px;justify-content:center}
.err{color:var(--warn);font-size:13px;min-height:20px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:var(--soft)}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar label{font-size:13px;color:var(--mut);margin-left:auto;display:flex;gap:6px;align-items:center}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.done{opacity:.6}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.when{font-weight:600;font-size:16px}
.tag{font-size:12px;border-radius:999px;padding:1px 10px;border:1px solid var(--line);color:var(--mut);margin-left:6px;font-weight:400;white-space:nowrap}
.no{font-size:12px;color:var(--mut)}
.who{margin:6px 0}
.who a{color:var(--ac);text-decoration:none;font-weight:500}
.items{background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.items div+div{margin-top:2px}
.note{font-size:14px;color:var(--warn);margin:6px 0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.total{font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.meta{text-align:center;color:var(--mut);font-size:12px;padding:8px 0 40px}
.meta button{padding:2px 12px;font-size:12px;margin:0 4px}
.hint{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);margin:4px 0 10px;text-align:center}
.newb{font-size:11px;padding:1px 9px;margin-left:6px;background:var(--warn);color:#fff;border-color:var(--warn)}
.card.fresh{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{padding:5px 14px;font-size:14px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin:6px 0 4px;border-bottom:1px solid var(--line)}
.chart .b{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.chart .col{display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px}
.chart .col i{display:block}
.chart .d{background:var(--ac)}.chart .p{background:var(--ac);opacity:.35}
.lab{display:flex;gap:3px;font-size:10px;color:var(--mut);margin-bottom:14px}
.lab span{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.legend{font-size:12px;color:var(--mut);margin-bottom:12px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ac);vertical-align:-1px;margin:0 4px 0 0}
.legend b.p{opacity:.35;margin-left:12px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--mut);font-size:12px}
tr.sum td{font-weight:600;border-bottom:0}
h3{font:500 16px "Noto Serif TC",Georgia,serif;margin:18px 0 6px}
.rank{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mut{color:var(--mut);font-size:12px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:9}
.pr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pr img,.pr .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.pr .in{flex:1;min-width:0}.pr .nm{font-weight:600}.pr .sub{font-size:12px;color:var(--mut)}
.pr.off{opacity:.5}
.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--mut)}
.pill.so{color:var(--warn);border-color:var(--warn)}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.acts button{padding:3px 10px;font-size:13px}
.cat{font:500 15px "Noto Serif TC",Georgia,serif;margin:18px 0 0;color:var(--ac)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;overflow:auto;padding:16px}
.dlg{background:var(--bg);border-radius:16px;max-width:520px;margin:0 auto;padding:18px}
.dlg h3{margin:0 0 10px}
.dlg label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font:inherit;color:inherit}
.dlg textarea{min-height:76px}
.grp{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--soft)}
.grp .r{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.grp .r input[type=text]{flex:1}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pre button{padding:3px 10px;font-size:13px}
.imgrow{display:flex;gap:12px;align-items:center}
.imgrow img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--soft)}
.dfoot{display:flex;gap:8px;margin-top:16px}.dfoot button{flex:1;border-radius:12px;padding:10px}
button.del{color:var(--warn);border-color:var(--warn)}
</style></head><body>

async function call(params){
  const u=API+'?'+new URLSearchParams({pw,...params});
  const r=await fetch(u,{redirect:'follow'});
  return r.json();
}
function pickKey(o){ // 依取餐日期時間排序用
  const m=/(\d+)月(\d+)日/.exec(o.when||''),t=/(上午|下午)\s*(\d+):(\d+)/.exec(o.when||'');
  if(!m)return 0;let h=t?+t[2]:0;if(t&&t[1]==='下午'&&h<12)h+=12;
  return (+m[1])*1e6+(+m[2])*1e4+h*100+(t?+t[3]:0);
}
function isToday(o){const m=/(\d+)月(\d+)日/.exec(o.when||'');const n=new Date();return !!m&&+m[1]===n.getMonth()+1&&+m[2]===n.getDate()}
async function load(silent){
  if(busy)return;busy=true;
  try{
    const r=await call({action:'list'});
    if(r.error==='auth'){logout();$('lerr').textContent='密碼不正確';return}
    if(r.error==='setpw'){logout();$('lerr').textContent='尚未在 Apps Script 設定後台密碼';return}
    if(r.error)throw new Error(r.error);
    orders=r.orders||[];detect(orders);render();
    const n=new Date();$('upd').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
  }catch(e){ if(!silent)toast('讀取失敗，請確認網路'); $('upd').textContent='讀取失敗' }
  finally{busy=false}
}
function render(){
  const pend=orders.filter(o=>o.status!=='已完成'),today=orders.filter(isToday);
  $('sPend').textContent=pend.length;$('sToday').textContent=today.length;
  $('sSum').textContent=today.reduce((s,o)=>s+(+o.total||0),0);
  document.title=(flash?'🔔 新訂單！':'')+(pend.length?'('+pend.length+') ':'')+'約飯吧・訂單後台';
  $('list').classList.toggle('hide',tab==='rev'||tab==='menu');$('rev').classList.toggle('hide',tab!=='rev');$('menuBox').classList.toggle('hide',tab!=='menu');$('todayWrap').classList.toggle('hide',tab==='rev'||tab==='menu');
  if(tab==='rev'){renderRev();return}
  if(tab==='menu'){renderMenu();return}
  let list=orders.slice();
  if($('onlyToday').checked)list=list.filter(isToday);
  if(tab==='pend')list=list.filter(o=>o.status!=='已完成').sort((a,b)=>pickKey(a)-pickKey(b)||a.ts.localeCompare(b.ts));
  else if(tab==='done')list=list.filter(o=>o.status==='已完成').sort((a,b)=>b.ts.localeCompare(a.ts));
  else list.sort((a,b)=>b.ts.localeCompare(a.ts));
  const box=$('list');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="empty">目前沒有訂單</div>';return}
  list.forEach(o=>{
    const done=o.status==='已完成',c=document.createElement('div');c.className='card'+(done?' done':'')+(fresh.has(o.no)?' fresh':'');
    const items=String(o.items||'').split('；').filter(Boolean).map(x=>'<div>'+esc(x)+'</div>').join('');
    const tel=String(o.phone||'').replace(/[^0-9+]/g,'');
    c.innerHTML=`<div class="top"><div class="when">${esc(o.when)}<span class="tag">${esc(o.mode)}</span>${fresh.has(o.no)?'<button class="newb" data-n="1">新訂單 ✕</button>':''}</div><div class="no">${esc(o.no)}</div></div>
<div class="who">${esc(o.name)}　<a href="tel:${esc(tel)}">${esc(o.phone)}</a></div>
<div class="items">${items}</div>${o.note?`<div class="note">備註：${esc(o.note)}</div>`:''}
<div class="foot"><span class="total">NT$${esc(o.total)}</span></div>`;
    const b=document.createElement('button');b.textContent=done?'還原為待處理':'標示完成';if(!done)b.className='pri',b.style.width='auto',b.style.padding='8px 22px';
    b.onclick=()=>setStatus(o,done?'待處理':'已完成');const nb=c.querySelector('.newb');if(nb)nb.onclick=()=>{fresh.delete(o.no);render()};c.querySelector('.foot').append(b);box.append(c);
  });
}
function pickDate(o){
  const m=/(\d+)月(\d+)日/.exec(o.when||'');if(!m)return null;
  const ts=new Date(o.ts);let y=isNaN(ts)?new Date().getFullYear():ts.getFullYear();const mo=+m[1];
  if(!isNaN(ts)&&mo<ts.getMonth()+1-6)y++;
  return new Date(y,mo-1,+m[2]);
}
const WD='日一二三四五六';
function renderRev(){
  const box=$('rev'),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const from=range?new Date(today.getFullYear(),today.getMonth(),today.getDate()-range+1):null;
  const days={},items={};let fut={n:0,sum:0};
  orders.forEach(o=>{
    const d=pickDate(o);if(!d)return;const amt=+o.total||0;
    if(d>today){fut.n++;fut.sum+=amt;return}
    if(from&&d<from)return;
    const r=days[d.getTime()]||(days[d.getTime()]={d,n:0,done:0,pend:0});
    r.n++;if(o.status==='已完成')r.done+=amt;else r.pend+=amt;
    String(o.items||'').split('；').forEach(s=>{const m=/^(.*?)（.*）x(\d+)$/.exec(s.trim());if(m)items[m[1]]=(items[m[1]]||0)+(+m[2])});
  });
  const rows=Object.values(days).sort((a,b)=>a.d-b.d);
  const tot=rows.reduce((s,r)=>({n:s.n+r.n,done:s.done+r.done,pend:s.pend+r.pend}),{n:0,done:0,pend:0});
  const avg=tot.n?Math.round((tot.done+tot.pend)/tot.n):0;
  const lab=[[1,'今天'],[7,'近 7 天'],[30,'近 30 天'],[0,'全部']].map(([v,l])=>`<button data-r="${v}" class="${v===range?'on':''}">${l}</button>`).join('');
  const chartRows=rows.slice(-30),max=Math.max(1,...chartRows.map(r=>r.done+r.pend));
  const bars=chartRows.map(r=>`<div class="b" title="${r.d.getMonth()+1}/${r.d.getDate()}　NT$${r.done+r.pend}"><div class="col" style="height:${Math.max(2,(r.done+r.pend)/max*100)}%"><i class="p" style="flex:${r.pend}"></i><i class="d" style="flex:${r.done}"></i></div></div>`).join('');
  const labs=chartRows.map(r=>`<span>${chartRows.length<=10?(r.d.getMonth()+1)+'/':''}${r.d.getDate()}</span>`).join('');
  const trs=rows.slice().reverse().map(r=>`<tr><td>${r.d.getMonth()+1}/${r.d.getDate()}（週${WD[r.d.getDay()]}）</td><td>${r.n}</td><td>${r.done}</td><td>${r.pend}</td></tr>`).join('');
  const rank=Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="rank"><span>${esc(n)}</span><span>${c} 份</span></div>`).join('');
  box.innerHTML=`<div class="seg">${lab}</div>
<div class="stats"><div class="stat"><b>${tot.done}</b><span>已完成營業額 NT$</span></div><div class="stat"><b>${tot.pend}</b><span>待處理金額 NT$</span></div><div class="stat"><b>${avg}</b><span>平均客單價 NT$</span></div></div>
${rows.length?`<div class="chart">${bars}</div><div class="lab">${labs}</div><div class="legend"><b></b>已完成<b class="p"></b>待處理</div>
<table><thead><tr><th>取餐日期</th><th>單數</th><th>已完成</th><th>待處理</th></tr></thead><tbody>${trs}<tr class="sum"><td>合計</td><td>${tot.n}</td><td>${tot.done}</td><td>${tot.pend}</td></tr></tbody></table>
<h3>餐點銷量</h3>${rank||'<div class="empty">沒有資料</div>'}`:'<div class="empty">這段期間沒有訂單</div>'}
${fut.n?`<div class="mut">另有 ${fut.n} 筆未來日期的預約（NT$${fut.sum}），到取餐日才會計入。</div>`:''}
<div class="mut">營業額依「取餐日期」計算，資料來自試算表最近 300 筆訂單。</div>`;
  box.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;range=+b.dataset.r;renderRev()};
}
async function setStatus(o,s){
  const old=o.status;o.status=s;render();
  try{const r=await call({action:'status',no:o.no,status:s});if(!r.ok)throw 0}
  catch(e){o.status=old;render();toast('更新失敗，請再試一次')}
}

/* ===== 商品管理 ===== */
let menu=null,menuReady=false,menuBusy=false;
const STS=['上架','售完','下架'];
async function postApi(body){
  await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pw,...body})});
}
async function loadMenuAdmin(){
  try{
    const r=await call({action:'menu_all'});
    if(r.error==='auth'){logout();$('lerr').textContent='密碼不正確';return false}
    if(r.error)throw new Error(r.error);
    menu=r.items||[];menuReady=!!r.ready;return true;
  }catch(e){toast('讀取商品失敗，請確認網路，或 Apps Script 是否已更新並部署新版本',3500);return false}
}
async function saveAndReload(body,check){
  if(menuBusy)return false;menuBusy=true;
  try{
    await postApi(body);
    let ok=false;
    for(let i=0;i<4&&!ok;i++){
      await new Promise(r=>setTimeout(r,i?900:500));
      if(await loadMenuAdmin()) ok=check?check(menu):true;
    }
    if(!ok)toast('儲存後沒有看到變更，請確認 Apps Script 已更新並部署「新版本」',4500);
    return ok;
  }finally{menuBusy=false;renderMenu()}
}
function cleanCats(){return [...new Set((menu||[]).map(p=>p.cat||''))]}
function renderMenu(){
  const B=$('menuBox');
  if(menu===null){B.innerHTML='<div class="empty">載入中…</div>';return}
  let h='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button class="pri" style="width:auto;padding:9px 18px" id="mAdd">＋ 新增商品</button>';
  if(!menu.length)h+='<button id="mImp">匯入現有餐點</button>';
  h+='</div><div class="mut" style="margin-top:4px">按「售完」客人會看到但無法點；「下架」客人看不到。變更儲存後，客人重新開網頁即生效。</div>';
  if(!menu.length)h+='<div class="empty">目前還沒有商品。<br>可按「匯入現有餐點」把原本 2 樣餐點帶進來，或直接新增。</div>';
  const cs=cleanCats();
  cs.forEach(c=>{
    const L=menu.filter(p=>(p.cat||'')===c);
    h+='<div class="cat">'+esc(c||'其他')+'</div>';
    L.forEach((p,i)=>{
      const st=p.status||'上架';
      h+='<div class="pr'+(st==='下架'?' off':'')+'" data-id="'+esc(p.id)+'">'+(p.img?'<img src="'+esc(p.img)+'" alt="">':'<div class="ph"></div>')+
      '<div class="in"><div class="nm">'+esc(p.name)+(st!=='上架'?'<span class="pill'+(st==='售完'?' so':'')+'">'+st+'</span>':'')+'</div><div class="sub">NT$ '+esc(p.price)+(p.opts&&p.opts.length?'・'+p.opts.length+' 組選項':'')+'</div></div>'+
      '<div class="acts"><button data-a="up"'+(i?'':' disabled')+'>↑</button><button data-a="dn"'+(i<L.length-1?'':' disabled')+'>↓</button>'+
      '<button data-a="so">'+(st==='售完'?'恢復':'售完')+'</button><button data-a="ed">編輯</button></div></div>';
    });
  });
  B.innerHTML=h;
}
$('menuBox').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='mAdd')return editProduct(null);
  if(b.id==='mImp')return importDefault();
  const row=b.closest('.pr');if(!row)return;
  const p=menu.find(x=>x.id===row.dataset.id);if(!p)return;
  const a=b.dataset.a;
  if(a==='ed')return editProduct(p);
  if(a==='so'){const s=p.status==='售完'?'上架':'售完';const ok=await saveAndReload({action:'menu_status',id:p.id,status:s},m=>(m.find(x=>x.id===p.id)||{}).status===s);if(ok)toast(s==='售完'?'已標示售完':'已恢復販售');return}
  if(a==='up'||a==='dn'){
    const L=menu.filter(x=>(x.cat||'')===(p.cat||''));const i=L.findIndex(x=>x.id===p.id),j=a==='up'?i-1:i+1;if(j<0||j>=L.length)return;
    const all=menu.slice().sort((x,y)=>(+x.sort||0)-(+y.sort||0));
    const A=all.findIndex(x=>x.id===L[i].id),Bi=all.findIndex(x=>x.id===L[j].id);
    [all[A],all[Bi]]=[all[Bi],all[A]];
    const items=all.map((x,k)=>({id:x.id,sort:k+1}));
    await saveAndReload({action:'menu_sort',items},m=>{const l=m.filter(x=>(x.cat||'')===(p.cat||''));return l[j]&&l[j].id===p.id});
  }
};
async function importDefault(){
  if(!confirm('要把原本的 2 樣餐點匯入商品管理嗎？'))return;
  const ok=await saveAndReload({action:'menu_upsert',items:DEFAULT_MENU},m=>m.length>0);
  if(ok)toast('已匯入');
}
function optToText(c){return (c||[]).map(x=>x[1]?x[0]+' +'+x[1]:x[0]).join('\n')}
function textToOpt(t){return String(t||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const m=/^(.*?)\s*[+＋]\s*(\d+)$/.exec(s);return m&&m[1]?[m[1].trim(),+m[2]]:[s,0]})}
const PRESETS={'辣度':{n:'辣度',m:0,c:[['不辣',0],['小辣',0],['中辣',0]]},'冰量':{n:'冰量',m:0,c:[['正常冰',0],['少冰',0],['去冰',0]]},'甜度':{n:'甜度',m:0,c:[['全糖',0],['半糖',0],['無糖',0]]},'加料':{n:'加料',m:1,c:[['加蛋',15]]}};
function editProduct(p){
  const isNew=!p;p=p?JSON.parse(JSON.stringify(p)):{id:'',cat:'',name:'',price:'',status:'上架',img:'',opts:[]};
  let img=p.img||'';
  const M=document.createElement('div');M.className='mask';
  const cs=cleanCats();
  M.innerHTML='<div class="dlg"><h3>'+(isNew?'新增商品':'編輯商品')+'</h3>'+
  '<label class="f">商品名稱</label><input type="text" id="eName" maxlength="40">'+
  '<label class="f">價格（元）</label><input type="number" id="ePrice" min="0" inputmode="numeric">'+
  '<label class="f">分類（例如：主食、湯品、飲料）</label><input type="text" id="eCat" list="eCats" maxlength="20"><datalist id="eCats">'+cs.filter(Boolean).map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist>'+
  '<label class="f">狀態</label><select id="eSt">'+STS.map(s=>'<option>'+s+'</option>').join('')+'</select>'+
  '<label class="f">照片（選填）</label><div class="imgrow"><img id="eImg" alt="" style="display:none"><div><input type="file" id="eFile" accept="image/*"><div><button type="button" id="eImgX" style="margin-top:6px;padding:2px 10px;font-size:12px">移除照片</button></div></div></div>'+
  '<label class="f">客製選項（例如辣度、加料）</label><div id="eGrps"></div>'+
  '<div class="pre"><button type="button" data-p="new">＋ 自訂選項組</button><button type="button" data-p="辣度">辣度</button><button type="button" data-p="冰量">冰量</button><button type="button" data-p="甜度">甜度</button><button type="button" data-p="加料">加料</button></div>'+
  '<div class="dfoot">'+(isNew?'':'<button class="del" type="button" id="eDel">刪除</button>')+'<button type="button" id="eCancel">取消</button><button type="button" class="pri" id="eSave">儲存</button></div></div>';
  document.body.append(M);
  const $$=id=>M.querySelector('#'+id);
  $$('eName').value=p.name;$$('ePrice').value=p.price;$$('eCat').value=p.cat||(cs[0]||'');$$('eSt').value=p.status||'上架';
  let groups=(p.opts||[]).map(g=>({n:g.n,m:g.m?1:0,t:optToText(g.c)}));
  function drawImg(){const e=$$('eImg');if(img){e.src=img;e.style.display=''}else e.style.display='none'}
  function drawG(){
    $$('eGrps').innerHTML=groups.map((g,i)=>'<div class="grp" data-i="'+i+'"><div class="r"><input type="text" class="gn" placeholder="選項組名稱，例如：辣度" value="'+esc(g.n)+'" maxlength="20"><label style="font-size:13px;white-space:nowrap"><input type="checkbox" class="gm"'+(g.m?' checked':'')+'> 可複選</label><button type="button" class="gx" style="padding:2px 10px">✕</button></div><textarea class="gt" placeholder="每行一個選項；要加價就寫「加蛋 +15」">'+esc(g.t)+'</textarea></div>').join('')||'<div class="mut" style="margin:4px 0">沒有客製選項也可以。</div>';
  }
  function syncG(){M.querySelectorAll('.grp').forEach(el=>{const g=groups[+el.dataset.i];g.n=el.querySelector('.gn').value;g.m=el.querySelector('.gm').checked?1:0;g.t=el.querySelector('.gt').value})}
  drawImg();drawG();
  M.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p){syncG();const k=b.dataset.p;const s=k==='new'?{n:'',m:0,t:''}:{n:PRESETS[k].n,m:PRESETS[k].m,t:optToText(PRESETS[k].c)};groups.push(s);drawG();return}
    if(b.classList.contains('gx')){syncG();groups.splice(+b.closest('.grp').dataset.i,1);drawG();return}
    if(b.id==='eImgX'){img='';drawImg();return}
    if(b.id==='eCancel'){M.remove();return}
    if(b.id==='eDel'){if(confirm('確定要刪除「'+p.name+'」嗎？（若只是暫時不賣，建議改用「下架」或「售完」）')){M.remove();saveAndReload({action:'menu_delete',id:p.id},m=>!m.some(x=>x.id===p.id)).then(ok=>ok&&toast('已刪除'))}return}
    if(b.id==='eSave'){
      syncG();
      const name=$$('eName').value.trim(),price=Math.round(+$$('ePrice').value);
      if(!name){toast('請輸入商品名稱');return}
      if(!(price>=0)||$$('ePrice').value===''){toast('請輸入價格');return}
      const opts=groups.filter(g=>g.n.trim()).map(g=>({n:g.n.trim(),m:g.m?1:0,c:textToOpt(g.t)})).filter(g=>g.c.length);
      const cat=$$('eCat').value.trim()||'其他';
      let sort=p.sort;if(isNew)sort=(menu.reduce((m,x)=>Math.max(m,+x.sort||0),0))+1;
      const item={id:p.id,cat,name,price,status:$$('eSt').value,sort,img,opts};
      M.remove();
      const before=menu.length;
      saveAndReload({action:'menu_upsert',items:[item]},m=>isNew?m.length>before||m.some(x=>x.name===name&&x.cat===cat&&x.price===price):(m.find(x=>x.id===p.id)||{}).name===name).then(ok=>ok&&toast('已儲存'));
    }
  });
  $$('eFile').onchange=ev=>{
    const f=ev.target.files[0];if(!f)return;
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{
      const S=160,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
      const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
      x.fillStyle='#fff';x.fillRect(0,0,S,S);x.drawImage(im,sx,sy,s,s,0,0,S,S);
      img=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(u);drawImg();
    };
    im.onerror=()=>toast('這張照片無法讀取，請換一張');
    im.src=u;
  };
}

const saved=store.get();if(saved){pw=saved;start()}
</script></body></html>
