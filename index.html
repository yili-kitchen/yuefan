<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>約飯吧 健康便當線上訂餐</title>
<style>
:root{--bg:#fff;--fg:#2b2b28;--mut:#8a877f;--line:#eee6dc;--soft:#fbf5ee;--ac:#e07b2a;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#eeece6;--mut:#a09d94;--line:#333330;--soft:#262624;--ac:#f0a060;--acf:#1c1c1a}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#eeece6;--mut:#a09d94;--line:#333330;--soft:#262624;--ac:#f0a060;--acf:#1c1c1a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:720px;margin:0 auto;padding:0 20px}
h1,h2{font-family:"Noto Serif TC",Georgia,serif;font-weight:500;margin:0}
.hero{text-align:center;padding:40px 0 32px}
.hero small{letter-spacing:.3em;color:var(--mut)}
.hero h1{font-size:30px;margin:8px 0 6px}.hero p{color:var(--mut);margin:0 0 24px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px}
button.on,button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button.pri{width:100%;padding:12px;border-radius:12px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{white-space:nowrap}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item b{font-weight:500}.item span{color:var(--mut);font-size:13px}
.item button{padding:6px 14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:3}
.bar .w{padding:0}
main{padding-bottom:110px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.grp{margin-top:14px}.grp>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;font-size:14px}
.q button{padding:2px 10px}
.tot{font-size:18px;text-align:right;margin:12px 0}
.o{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.ft{text-align:center;color:var(--mut);font-size:12px;padding:20px 0 120px}
.ft a{color:inherit;text-decoration:underline;cursor:pointer}
.hide{display:none}
</style></head><body>

let PRODUCTS=null,cat='',cart=[],mode='外帶',cur=null,db=null,user=null,unsub=null,orders=[];
const pad=n=>String(n).padStart(2,'0');
const WD='日一二三四五六',SL=[];for(let h=17;h<=19;h++)for(const m of [0,15,30,45]){if(h<19||m===0)SL.push(pad(h)+':'+pad(m))}
const slot=(d,t)=>{const [h,m]=t.split(':');return new Date(d.getFullYear(),d.getMonth(),d.getDate(),+h,+m)};
function fillDates(){const now=new Date(),lim=now.getTime()+18e5,sel=$('wd');sel.innerHTML='';let n=0;for(let i=0;i<28&&n<10;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),g=d.getDay();if(g<1||g>5||!SL.some(t=>slot(d,t)>lim))continue;const o=document.createElement('option');o.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());o.textContent=`${d.getMonth()+1}月${d.getDate()}日（週${WD[g]}）`;sel.append(o);n++}fillTimes()}
function fillTimes(){const v=$('wd').value,t=$('wt');t.innerHTML='';if(v){const [y,m,d]=v.split('-').map(Number),day=new Date(y,m-1,d),lim=Date.now()+18e5;SL.filter(s=>slot(day,s)>lim).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent='下午 '+(+s.slice(0,2)-12)+s.slice(2);t.append(o)})}sync()}
function sync(){$('when').value=$('wd').value&&$('wt').value?$('wd').value+'T'+$('wt').value:''}
$('wd').onchange=fillTimes;$('wt').onchange=sync;fillDates();
const cats=()=>{const a=[];(PRODUCTS||[]).forEach(p=>{if(!a.includes(p.cat))a.push(p.cat)});return a};
async function loadMenu(){
  let cached=null;try{cached=JSON.parse(localStorage.getItem('yuefan_menu')||'null')}catch(e){}
  if(Array.isArray(cached)&&cached.length){PRODUCTS=cached;renderTabs()}
  else $('list').innerHTML='<p style="color:var(--mut)">菜單載入中…</p>';
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(API+'?action=menu',{signal:ctl.signal});clearTimeout(t);
    const j=await r.json();
    if(Array.isArray(j.items)){
      if(j.items.length){PRODUCTS=j.items;try{localStorage.setItem('yuefan_menu',JSON.stringify(j.items))}catch(e){}}
      else if(j.ready){PRODUCTS=[];try{localStorage.removeItem('yuefan_menu')}catch(e){}}
      else if(!PRODUCTS)PRODUCTS=DEFAULT_MENU;
    }else if(!PRODUCTS)PRODUCTS=DEFAULT_MENU;
  }catch(e){if(!PRODUCTS)PRODUCTS=DEFAULT_MENU}
  renderTabs();
}
function renderTabs(){
  if(!PRODUCTS)return;
  const cs=cats();if(!cs.includes(cat))cat=cs[0]||'';
  const tb=$('tabs');tb.innerHTML='';
  cs.forEach(k=>{const b=document.createElement('button');b.textContent=k||'其他';b.className=k===cat?'on':'';b.onclick=()=>{cat=k;renderTabs()};tb.append(b)});
  const L=$('list');L.innerHTML='';
  const items=PRODUCTS.filter(p=>p.cat===cat);
  if(!items.length){L.innerHTML='<p style="color:var(--mut)">目前沒有上架商品</p>';return}
  items.forEach(p=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div style="display:flex;gap:12px;align-items:center">${p.img?`<img src="${esc(p.img)}" width="64" height="64" style="border-radius:12px;object-fit:cover" alt="">`:''}<div><b>${esc(p.name)}</b><br><span>NT$${esc(p.price)}</span></div></div>`;
    const b=document.createElement('button');
    if(p.status==='售完'){b.textContent='已售完';b.disabled=true;b.style.opacity='.5';b.style.cursor='default'}
    else{b.textContent='加入 ＋';b.onclick=()=>openOpt(p)}
    d.append(b);L.append(d);
  });
}
function openOpt(p){
  const opts=(p.opts||[]).filter(g=>g&&g.n&&Array.isArray(g.c)&&g.c.length);
  cur={name:p.name,base:+p.price||0,opts,sel:{}};
  opts.forEach(g=>{cur.sel[g.n]=g.m?[]:[g.c[0][0]]});
  $('oT').textContent=p.name;$('oN').value='';drawOpt();$('sOpt').classList.add('show');
}
function optPrice(){let p=cur.base;cur.opts.forEach(g=>g.c.forEach(([l,x])=>{if(cur.sel[g.n].includes(l))p+=x}));return p}
function drawOpt(){const box=$('oG');box.innerHTML='';cur.opts.forEach(g=>{const s=document.createElement('div');s.className='grp';s.innerHTML=`<b>${esc(g.n)}</b>${g.m?' <span style="color:var(--mut);font-size:12px">可複選</span>':''}`;const w=document.createElement('div');g.c.forEach(([l,x])=>{const b=document.createElement('button');const on=cur.sel[g.n].includes(l);b.className=on?'on':'';b.textContent=l+(x?` +${x}`:'');b.onclick=()=>{const a=cur.sel[g.n];if(g.m){on?a.splice(a.indexOf(l),1):a.push(l)}else cur.sel[g.n]=[l];drawOpt()};w.append(b)});s.append(w);box.append(s)});$('oP').textContent='NT$'+optPrice()}
function addCart(){const opts=Object.values(cur.sel).flat().join('／'),note=$('oN').value.trim(),price=optPrice();const k=cur.name+opts+note;const f=cart.find(x=>x.k===k);f?f.qty++:cart.push({k,name:cur.name,opts,note,price,qty:1});closeS();upd()}
const total=()=>cart.reduce((s,x)=>s+x.price*x.qty,0);
function upd(){const c=cart.reduce((s,x)=>s+x.qty,0);$('cartBtn').textContent=`購物車（${c}）　NT$${total()}`}
function openCart(){drawCart();$('sCart').classList.add('show')}
function drawCart(){const L=$('cL');L.innerHTML='';if(!cart.length){L.innerHTML='<p style="color:var(--mut)">購物車是空的</p>'}
cart.forEach((x,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><b>${esc(x.name)}</b><br><span style="color:var(--mut);font-size:12px">${esc(x.opts)}${x.note?'・'+esc(x.note):''}</span></div>`;const q=document.createElement('div');q.className='q';q.innerHTML=`<button>－</button> ${x.qty} <button>＋</button> NT$${x.price*x.qty}`;const [m,p]=q.querySelectorAll('button');m.onclick=()=>{x.qty--;if(!x.qty)cart.splice(i,1);drawCart();upd()};p.onclick=()=>{x.qty++;drawCart();upd()};r.append(q);L.append(r)});
$('cT').textContent='合計 NT$'+total();$('cF').classList.toggle('hide',!cart.length)}
function closeS(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'))}
async function getDb(){if(db)return db;try{db=await claude.use('db')}catch(e){}return db}
async function submitOrder(){const name=$('fN').value.trim(),phone=$('fP').value.trim();
if(!name||!/^[0-9+\-\s]{8,15}$/.test(phone)){$('err').textContent='請填寫姓名與正確的手機號碼';return}
if(!$('when').value){$('err').textContent='請先在頁面上方選擇預約日期與時間';return}
$('err').textContent='';$('sub').disabled=true;
const no='A'+String(Date.now()).slice(-6);
const o={no,name,phone,email:'',note:$('fM').value.trim(),mode,when:$('wd').selectedOptions[0].text+' '+$('wt').selectedOptions[0].text,items:cart.map(({name,opts,note,price,qty})=>({name,opts,note,price,qty})),total:total(),status:'待處理',ts:Date.now()};
let saved=false;try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});saved=true}catch(e){}
const txt=`【約飯吧】訂單 ${no}\n${mode}｜${o.when}\n${name} ${phone}\n`+o.items.map(x=>`${x.name}${x.opts?`（${x.opts}）`:''} x${x.qty} NT$${x.price*x.qty}`).join('\n')+`\n合計 NT$${o.total}`+(o.note?`\n備註：${o.note}`:'');
$('okT').textContent=saved?`訂單編號 ${no}，店家已收到您的訂單，請依預約時間前來取餐。`:`訂單編號 ${no}。目前無法連線至店家系統，請複製下方內容傳給店家確認。`;
$('okS').value=txt;cart=[];upd();$('sub').disabled=false;closeS();$('sOk').classList.add('show')}
async function openAdmin(){$('sAdm').classList.add('show');$('aL').innerHTML='';$('csv').classList.add('hide');
try{user=await claude.use('user')}catch(e){}
const d=await getDb();
if(!d||!(user&&user.canEdit())){$('aMsg').textContent='此頁僅限店家（擁有編輯權限者）登入後查看。';return}
$('aMsg').textContent='即時訂單';$('csv').classList.remove('hide');
if(unsub)unsub();unsub=d.collection('orders').orderBy('ts','desc').onSnapshot(s=>{orders=s.docs.map(x=>x.data());drawAdmin()},e=>{$('aMsg').textContent='讀取失敗：'+e.message})}
function drawAdmin(){const L=$('aL');L.innerHTML='';if(!orders.length){L.innerHTML='<p style="color:var(--mut)">目前沒有訂單</p>';return}
orders.forEach(o=>{const d=document.createElement('div');d.className='o';d.innerHTML=`<div class="row" style="padding:0"><b>${esc(o.no)}・${esc(o.name)}</b><span>NT$${o.total}</span></div><div style="color:var(--mut);font-size:13px">${esc(o.mode)}｜${esc(o.when)}｜${esc(o.phone)}</div>`+o.items.map(x=>`<div>${esc(x.name)}（${esc(x.opts)}）×${x.qty}</div>`).join('')+(o.note?`<div style="color:var(--mut)">備註：${esc(o.note)}</div>`:'');
